<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clover Hollow Farm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen game. Wooden HUD on top, isometric field in the middle, wooden tool bar at the bottom. Single daytime look by choice. */
:root{
  --sky:#a8dbee; --meadow:#d9efc4;
  --grass:#7cbd4b; --grass2:#70b243; --soil:#8d5b34; --soil2:#6e4426; --furrow:#5f3a20; --fallow:#a77a4c;
  --wood:#f7e7c6; --wood2:#ecd3a3; --wood-edge:#8a5a2b; --ink:#3b2716; --muted:#7a5e43;
  --gold:#f3b80a; --gold-ink:#7a5600; --barn:#c4452f; --xp:#5aa9e6; --lock:#b9a586;
  --font-display:'Sniglet','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--barn);outline-offset:2px}

.hud{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--wood);border-bottom:3px solid var(--wood-edge);z-index:50}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.15rem;color:var(--barn);white-space:nowrap;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:6px;background:#fffaf0;border:2px solid var(--wood-edge);border-radius:999px;padding:3px 10px 3px 4px;font-weight:800;font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,var(--gold) 60%,#c98f00);border:1.5px solid var(--gold-ink);flex:none}
.lvl{width:24px;height:24px;border-radius:50%;background:var(--xp);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:.85rem;border:1.5px solid #2f6f9f;flex:none}
.xpbar{width:60px;height:8px;border-radius:5px;background:#e3d6bd;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--xp);transition:width .3s}

.field{flex:1;min-height:0;overflow:auto;background:linear-gradient(var(--sky) 0,var(--meadow) 45%);padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#board{position:relative;margin:0 auto;touch-action:none}
.land,.edge{position:absolute;left:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.edge{background:var(--soil2)}
.land{background:var(--grass2)}
.tile{position:absolute;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:var(--grass);z-index:2}
.tile.alt{background:var(--grass2)}
.tile::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,0);transition:background .12s}
@media (hover:hover){.tile:hover::after{background:rgba(255,255,255,.22)}}
.tile.plot{background:var(--soil) repeating-linear-gradient(-26.5deg,transparent 0 5px,var(--furrow) 5px 7px)}
.tile.fallow{background:var(--fallow) repeating-linear-gradient(26.5deg,transparent 0 6px,rgba(90,60,30,.45) 6px 7px)}
.tile.q::after{background:rgba(255,236,140,.45);animation:qpulse 1s ease-in-out infinite}
.tile.sel::after{background:rgba(196,69,47,.35)}
@keyframes qpulse{50%{background:rgba(255,236,140,.15)}}
.spr{position:absolute;pointer-events:none}
.spr svg{width:100%;height:100%;display:block;overflow:visible}
.spr.ripe svg{animation:bob 1.6s ease-in-out infinite;transform-origin:50% 92%}
.spr.anim svg{animation:sway 2.4s ease-in-out infinite;transform-origin:50% 90%}
.spr .bubble{animation:bob 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3%) scale(1.03)}}
@keyframes sway{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}

.farmer{position:absolute;pointer-events:none}
.farmer svg{width:100%;height:100%;display:block;overflow:visible}
.farmer.flip svg{transform:scaleX(-1)}
.farmer.walk .body{animation:step .26s ease-in-out infinite alternate}
.farmer.walk .legL{animation:legA .26s linear infinite alternate}
.farmer.walk .legR{animation:legA .26s linear infinite alternate-reverse}
.farmer .tool{transform-box:view-box;transform-origin:27px 30px}
.farmer.work .tool{animation:swing .3s ease-in-out infinite alternate}
.farmer.work .body{animation:lean .3s ease-in-out infinite alternate}
@keyframes step{to{transform:translateY(-1.6px)}}
@keyframes legA{to{transform:translateY(-1.8px)}}
@keyframes swing{from{transform:rotate(-35deg)}to{transform:rotate(25deg)}}
@keyframes lean{to{transform:translateY(1.2px)}}
.dust{position:absolute;pointer-events:none;width:14px;height:8px;border-radius:50%;background:rgba(140,100,60,.45);animation:puff .6s ease-out forwards}
@keyframes puff{to{transform:translateY(-10px) scale(2.2);opacity:0}}

.float{position:absolute;z-index:9999;pointer-events:none;font-family:var(--font-display);font-weight:800;font-size:.95rem;white-space:nowrap;transform:translate(-50%,0);animation:rise 1.1s ease-out forwards;text-shadow:0 1px 0 #fff,0 0 3px #fff}
.float.coins{color:var(--gold-ink)}.float.xp{color:#2f6f9f}.float.bad{color:var(--barn)}
@keyframes rise{to{transform:translate(-50%,-38px);opacity:0}}

.hint{min-height:2.4em;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding-block:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#fffaf0;border-top:2px solid var(--wood2);font-weight:700;font-size:.9rem;color:var(--muted)}
.hint button{border:2px solid var(--wood-edge);background:var(--wood);border-radius:999px;padding:2px 10px;font-weight:800;font-size:.8rem;flex:none}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--wood);border-top:3px solid var(--wood-edge);z-index:50}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;background:#fffaf0;border:2px solid var(--wood2);border-radius:12px;font-weight:800;font-size:.75rem;min-width:0}
.tool .ic{width:30px;height:30px}
.tool .ic svg{width:100%;height:100%}
.tool[aria-pressed="true"]{border-color:var(--barn);background:#ffe9d9;box-shadow:inset 0 -3px 0 var(--barn)}
.tool span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.badge{position:absolute;top:-6px;right:-4px;background:var(--barn);color:#fff;border-radius:999px;font-size:.7rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid #fffaf0}

.sheet-wrap{position:fixed;inset:0;background:rgba(40,25,10,.35);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:80%;display:flex;flex-direction:column;background:var(--wood);border:3px solid var(--wood-edge);border-bottom:0;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet h2{font-family:var(--font-display);font-weight:800;font-size:1.3rem;margin:0;color:var(--barn);text-wrap:balance}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px}
.x{border:2px solid var(--wood-edge);background:#fffaf0;border-radius:999px;padding:4px 12px;font-weight:800}
.tabs{display:flex;gap:6px;padding:4px 12px;overflow-x:auto}
.tabs button{flex:none;border:2px solid var(--wood2);background:#fffaf0;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem}
.tabs button[aria-pressed="true"]{border-color:var(--barn);color:var(--barn)}
.list{overflow:auto;padding:6px 12px 16px;display:grid;gap:8px}
.item{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;background:#fffaf0;border:2px solid var(--wood2);border-radius:14px;padding:8px 10px;text-align:left;width:100%}
.item.on{border-color:var(--barn);box-shadow:inset 0 0 0 1px var(--barn)}
.item.locked{opacity:.6;filter:grayscale(.6)}
.item .pic{width:52px;height:52px;background:var(--grass);border-radius:10px;padding:3px}
.item .pic.s{background:var(--soil)}
.item b{font-family:var(--font-display);font-weight:800;font-size:1.05rem;display:block}
.meta{font-size:.78rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35}
.price{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.price .coin{width:16px;height:16px}
.stars{color:var(--gold);letter-spacing:1px;font-size:.85rem}
.stars .off{color:#d8c7a6}
.note{font-size:.8rem;color:var(--muted);padding:0 16px 4px;font-weight:700}
.big{margin:4px 0 0;border:2px solid var(--wood-edge);background:var(--barn);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;font-family:var(--font-display);font-size:1.05rem}
.big:disabled{background:var(--lock);cursor:not-allowed}
.rib{width:44px;height:52px}
.prog{height:8px;border-radius:5px;background:#e3d6bd;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--barn)}

.modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(40,25,10,.4);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--wood);border:3px solid var(--wood-edge);border-radius:20px;padding:20px 22px;text-align:center;max-width:340px;animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
.card h3{font-family:var(--font-display);font-weight:800;font-size:1.7rem;margin:0;color:var(--barn);text-wrap:balance}
.card .sub{font-family:var(--font-display);color:#2f6f9f;font-size:1.1rem;margin-top:2px}
.card p{margin:8px 0 12px;font-weight:700;color:var(--muted)}
.card .gifts{display:flex;justify-content:center;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.card .gifts span{width:52px;height:52px;background:var(--grass);border-radius:12px;padding:3px;position:relative}
.card .gifts em{position:absolute;right:-4px;bottom:-4px;background:var(--barn);color:#fff;border-radius:999px;font-style:normal;font-size:.7rem;font-weight:800;padding:0 5px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:250;background:#fffaf0;border:2px solid var(--wood-edge);border-radius:14px;padding:8px 14px;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.12);animation:pop .3s cubic-bezier(.3,1.6,.6,1);max-width:calc(100% - 32px)}
.toast svg{width:26px;height:30px;flex:none}
@media (prefers-reduced-motion:reduce){.spr svg,.spr .bubble,.card,.toast,.float,.farmer *{animation:none!important}.float{opacity:0}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head>
<body>


<header class="hud">
  <div class="brand">Clover Hollow</div>
  <div class="chip" title="Coins"><span class="coin"></span><span id="coins">0</span></div>
  <button class="chip" id="lvlchip" title="Your level"><span class="lvl" id="lvl">1</span><span class="xpbar"><i id="xpfill"></i></span></button>
</header>
<main class="field" id="field"><div id="board"></div></main>
<div class="hint" id="hint"></div>
<nav class="tools" aria-label="Farm tools">
  <button class="tool" id="t-hand" aria-pressed="true"><span class="ic" id="ic-hand"></span><span>Farm</span></button>
  <button class="tool" id="t-market" aria-pressed="false"><span class="ic" id="ic-market"></span><span>Market</span></button>
  <button class="tool" id="t-gift" aria-pressed="false"><span class="ic" id="ic-gift"></span><span>Gift Box</span><i class="badge" id="giftbadge" hidden></i></button>
  <button class="tool" id="t-ribbons" aria-pressed="false"><span class="ic" id="ic-rib"></span><span>Ribbons</span></button>
  <button class="tool" id="t-more" aria-pressed="false"><span class="ic" id="ic-more"></span><span id="morelabel">Tools</span></button>
</nav>
<div class="sheet-wrap" id="sheetwrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle">
    <div class="sheet-head"><h2 id="sheettitle">Market</h2><button class="x" id="sheetclose">Close</button></div>
    <div class="tabs" id="sheettabs" hidden></div>
    <div class="note" id="sheetnote"></div>
    <div class="list" id="sheetlist"></div>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="card"><h3 id="m-title"></h3><div class="sub" id="m-sub"></div><div class="gifts" id="m-gifts"></div><p id="m-text"></p><button class="big" id="m-ok">OK</button></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const KEY='clover-hollow-v2';
const PLOW_COST=15, WITHER_FACTOR=2.5, MASTERY_LEVEL=10, SPEED=4.2;
const CROPS=[
 {id:'sunpea',name:'Sunpea',lvl:1,cost:10,time:120,sell:30,xp:1,fruit:'#f6c51b',leaf:'#4f9a2f',shape:'round'},
 {id:'bramble',name:'Bramblebean',lvl:1,cost:15,time:600,sell:48,xp:1,fruit:'#7b3fa0',leaf:'#3f8a3a',shape:'pod'},
 {id:'glowroot',name:'Glowroot',lvl:3,cost:30,time:3600,sell:95,xp:2,fruit:'#ff8a3d',leaf:'#5aa83a',shape:'root'},
 {id:'puffcorn',name:'Puffcorn',lvl:5,cost:45,time:4*3600,sell:160,xp:2,fruit:'#ffe7a0',leaf:'#6aa53a',shape:'tall'},
 {id:'velvet',name:'Velvet Melon',lvl:8,cost:80,time:8*3600,sell:290,xp:3,fruit:'#e45b78',leaf:'#3f8a3a',shape:'melon'},
 {id:'frostmint',name:'Frostmint',lvl:11,cost:60,time:12*3600,sell:330,xp:3,fruit:'#9fe6ee',leaf:'#2f8f74',shape:'leafy'},
 {id:'ember',name:'Emberpepper',lvl:14,cost:120,time:16*3600,sell:520,xp:4,fruit:'#d8322a',leaf:'#4a8a2a',shape:'pod'},
 {id:'cloud',name:'Cloudberry',lvl:17,cost:150,time:24*3600,sell:800,xp:5,fruit:'#f1ecff',leaf:'#4f9a5f',shape:'round'}
];
const ITEMS=[
 {id:'blushapple',kind:'tree',name:'Blush Apple Tree',lvl:1,cost:150,time:8*3600,yield:35,xp:3,fruit:'#e2404f',leaf:'#4e9a34'},
 {id:'sugarplum',kind:'tree',name:'Sugarplum Tree',lvl:2,cost:200,time:12*3600,yield:50,xp:4,fruit:'#7a3e9d',leaf:'#3f8a3a'},
 {id:'honeyfig',kind:'tree',name:'Honeyfig Tree',lvl:3,cost:260,time:16*3600,yield:65,xp:5,fruit:'#a0632f',leaf:'#5aa83a'},
 {id:'starpeach',kind:'tree',name:'Starpeach Tree',lvl:4,cost:320,time:24*3600,yield:95,xp:6,fruit:'#ffa56b',leaf:'#4f9a2f'},
 {id:'mooncitrus',kind:'tree',name:'Mooncitrus Tree',lvl:7,cost:420,time:24*3600,yield:115,xp:8,fruit:'#ffe14d',leaf:'#3d8a3a'},
 {id:'limeling',kind:'tree',name:'Limeling Tree',lvl:10,cost:600,time:48*3600,yield:230,xp:12,fruit:'#9bd34a',leaf:'#2f7f3a'},
 {id:'hen',kind:'animal',name:'Speckled Hen',lvl:4,cost:350,time:12*3600,yield:30,xp:7,prod:'egg'},
 {id:'cow',kind:'animal',name:'Bramble Cow',lvl:3,cost:600,time:24*3600,yield:75,xp:12,prod:'milk'},
 {id:'sheep',kind:'animal',name:'Cloud Sheep',lvl:7,cost:500,time:24*3600,yield:60,xp:10,prod:'wool'},
 {id:'pig',kind:'animal',name:'Truffle Pig',lvl:10,cost:800,time:24*3600,yield:95,xp:16,prod:'truffle'},
 {id:'bunny',kind:'animal',name:'Clover Bunny',lvl:12,cost:450,time:12*3600,yield:40,xp:9,prod:'clover'},
 {id:'duck',kind:'animal',name:'Puddle Duck',lvl:15,cost:520,time:12*3600,yield:45,xp:10,prod:'feather'},
 {id:'hay',kind:'decor',name:'Hay Bale',lvl:1,cost:10,xp:1},
 {id:'fence',kind:'decor',name:'Picket Fence',lvl:1,cost:20,xp:1},
 {id:'flowers',kind:'decor',name:'Wildflower Patch',lvl:2,cost:40,xp:2},
 {id:'scare',kind:'decor',name:'Scarecrow',lvl:4,cost:150,xp:6},
 {id:'cart',kind:'decor',name:'Flower Cart',lvl:6,cost:250,xp:10}
];
const WELCOME={blushapple:1,hay:4,cow:1,hen:1};
const TITLES=['Seedling','Sprout Tender','Weed Puller','Furrow Friend','Hay Hauler','Garden Keeper','Barn Helper','Orchard Hand','Field Steward','Harvest Hero','Soil Sage','Meadow Maker','Tractor Dreamer','Clover Captain','Hollow Homesteader','Barnyard Boss','Market Maven','Golden Grower','Prize Planter','Country Legend','Sunrise Rancher','Valley Elder','Bountiful Baron','Harvest Moon','Hollow Royalty'];
const RIBBONS=[
 {id:'plow',name:'Plow Pro',desc:'Plow plots',stat:'plow',tiers:[25,100,500,1500]},
 {id:'plant',name:'Seed Sower',desc:'Plant crops',stat:'plant',tiers:[25,100,500,1500]},
 {id:'harvest',name:'Full Basket',desc:'Harvest crops',stat:'harvest',tiers:[25,100,500,1500]},
 {id:'tree',name:'Orchard Keeper',desc:'Collect from trees',stat:'tree',tiers:[10,50,200,600]},
 {id:'animal',name:'Animal Friend',desc:'Collect from animals',stat:'animal',tiers:[10,50,200,600]},
 {id:'decor',name:'Pretty Patch',desc:'Place decorations',stat:'decor',tiers:[5,25,100,250]},
 {id:'earn',name:'Coin Counter',desc:'Earn coins',stat:'earned',tiers:[1000,10000,50000,250000]}
];
const TIER=[{n:'Yellow',c:'#f3c623',coins:100,xp:5},{n:'White',c:'#f4f1ea',coins:300,xp:15},{n:'Red',c:'#d8423a',coins:800,xp:40},{n:'Blue',c:'#3a78d8',coins:2000,xp:100}];
const SIZES=[{n:8,cost:0,lvl:1},{n:10,cost:2000,lvl:5},{n:12,cost:10000,lvl:10},{n:14,cost:40000,lvl:16}];
const MASTERY=[25,100,250];
const C=Object.fromEntries(CROPS.map(c=>[c.id,c])), I=Object.fromEntries(ITEMS.map(d=>[d.id,d]));

/* ---------- state ---------- */
function fresh(){
  const t={};
  for(const [x,y] of [[3,3],[4,3],[5,3],[3,4],[4,4],[5,4]])t[x+','+y]={t:'plot'};
  return {coins:200,xp:0,size:8,tiles:t,gift:{},sel:'sunpea',mastery:{},stats:{plow:0,plant:0,harvest:0,tree:0,animal:0,decor:0,earned:0},ribbons:{},farmer:{x:2,y:5},welcomed:false};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.tiles)S=fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const T=L=>Math.round(5*Math.pow(L-1,2.4)); // total XP needed for level L
function levelInfo(xp){let L=1;while(xp>=T(L+1))L++;return{L,into:xp-T(L),need:T(L+1)-T(L)}}
const level=()=>levelInfo(S.xp).L;
const title=L=>TITLES[L-1]||('Hollow Royalty '+(L-TITLES.length+1));

/* ---------- drawing ---------- */
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(v+a)));return'#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
const svg=(inner,vb='0 0 40 40')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
const shadow='<ellipse cx="20" cy="36.5" rx="9" ry="2.2" fill="rgba(60,30,10,.25)"/>';
function leaf(x,y,dir,len,col,wilt){const cx=x+dir*len*.55,rot=wilt?dir*35:dir*-25;return`<ellipse cx="${cx}" cy="${y}" rx="${len*.6}" ry="${len*.27}" fill="${col}" transform="rotate(${rot} ${x} ${y})"/>`}
function fruit(c){
  const F=c.fruit,dk=shade(F,-55),hl='rgba(255,255,255,.55)';
  switch(c.shape){
    case'round':return[[13.5,22],[26.5,20],[20,14]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.6" fill="${F}" stroke="${dk}" stroke-width=".8"/><circle cx="${x-1.1}" cy="${y-1.2}" r="1" fill="${hl}"/>`).join('');
    case'pod':return`<ellipse cx="15" cy="25" rx="2.2" ry="5.8" fill="${F}" stroke="${dk}" stroke-width=".8" transform="rotate(18 15 25)"/><ellipse cx="25.5" cy="22" rx="2.2" ry="5.8" fill="${F}" stroke="${dk}" stroke-width=".8" transform="rotate(-18 25.5 22)"/><ellipse cx="20" cy="17" rx="1.8" ry="4.6" fill="${F}" stroke="${dk}" stroke-width=".8"/>`;

    else if(tile.t==='fallow'){key='f';cls='tile fallow'}
    else if(tile.t==='crop'){const st=stageOf(tile,now);key='c'+tile.crop+st;cls='tile plot';html=plantSVG(C[tile.crop],st);if(st==='r')sc='ripe'}
    else if(tile.t==='item'){const it=I[tile.item];const r=it.kind!=='decor'&&now>=readyAt(tile);key='i'+tile.item+r;html=itemSVG(tile.item,r);if(it.kind==='animal')sc='anim';else if(r)sc='ripe'}
  }
  if(qcount[k])cls+=' q';
  if(moveSel===k)cls+=' sel';
  if(keys[k]===key+cls)return;keys[k]=key+cls;
  e.t.className=cls;
  if(e.s.dataset.key!==key){e.s.innerHTML=html;e.s.dataset.key=key}
  e.s.className='spr '+sc;
}
function paintAll(){const now=Date.now();for(const k in els)paint(k,now)}

/* ---------- HUD ---------- */
function hud(){
  document.getElementById('coins').textContent=S.coins.toLocaleString();
  const li=levelInfo(S.xp);document.getElementById('lvl').textContent=li.L;
  document.getElementById('xpfill').style.width=(100*li.into/li.need)+'%';
  const g=Object.values(S.gift).reduce((a,b)=>a+b,0),gb=document.getElementById('giftbadge');gb.hidden=!g;gb.textContent=g;
  document.getElementById('t-hand').setAttribute('aria-pressed',String(mode==='hand'));
  document.getElementById('t-more').setAttribute('aria-pressed',String(mode==='move'||mode==='delete'));
  document.getElementById('ic-more').innerHTML=mode==='move'?ICON.move:mode==='delete'?ICON.del:ICON.more;
  document.getElementById('morelabel').textContent=mode==='move'?'Move':mode==='delete'?'Delete':'Tools';
}
document.getElementById('ic-hand').innerHTML=ICON.hand;
document.getElementById('ic-market').innerHTML=ICON.market;
document.getElementById('ic-gift').innerHTML=ICON.gift;
document.getElementById('ic-rib').innerHTML=ribbonSVG('#f3c623');
const hintEl=document.getElementById('hint');
function hint(t,btn){hintEl.innerHTML='';hintEl.append(t);if(btn){const b=document.createElement('button');b.textContent=btn[0];b.onclick=btn[1];hintEl.append(b)}}
function fmt(s){s=Math.max(0,Math.ceil(s));if(s<60)return s+'s';const m=Math.floor(s/60);if(m<60)return m+'m'+(s%60?' '+s%60+'s':'');const h=Math.floor(m/60);return h+'h'+(m%60?' '+m%60+'m':'')}
function floatAt(k,text,cls,dy=0){
  const [x,y]=k.split(',').map(Number),p=screen(x,y);
  const f=document.createElement('div');f.className='float '+cls;f.textContent=text;
  f.style.left=p.x+'px';f.style.top=(p.y-W*.75+dy)+'px';
  board.append(f);setTimeout(()=>f.remove(),1150);
}
let toastT;
function toast(html){const t=document.getElementById('toast');t.innerHTML=html;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
function gain(k,coins,xp){
  const before=level();S.coins+=coins;S.xp+=xp;
  if(coins>0)bump('earned',coins);
  if(coins&&k)floatAt(k,(coins>0?'+':'')+coins,coins>0?'coins':'bad');
  if(xp&&k)floatAt(k,'+'+xp+' XP','xp',16);
  hud();const after=level();if(after>before)levelUp(after);
}
function bump(stat,n=1){
  S.stats[stat]=(S.stats[stat]||0)+n;
  for(const r of RIBBONS){if(r.stat!==stat)continue;const have=S.ribbons[r.id]||0;
    if(have<4&&S.stats[stat]>=r.tiers[have]){S.ribbons[r.id]=have+1;const t=TIER[have];
      setTimeout(()=>{toast(ribbonSVG(t.c)+`<span>${t.n} ribbon: ${r.name}! +${t.coins} coins</span>`);gain(null,t.coins,t.xp)},400)}}
}
function showModal(title,sub,text,gifts,btn,cb){
  document.getElementById('m-title').textContent=title;document.getElementById('m-sub').textContent=sub||'';
  document.getElementById('m-text').textContent=text;document.getElementById('m-gifts').innerHTML=gifts||'';
  const ok=document.getElementById('m-ok');ok.textContent=btn||'OK';ok.onclick=()=>{document.getElementById('modal').hidden=true;cb&&cb()};
  document.getElementById('modal').hidden=false;
}
function levelUp(L){
  const un=[...CROPS.filter(c=>c.lvl===L).map(c=>c.name),...ITEMS.filter(d=>d.lvl===L).map(d=>d.name),...SIZES.filter(s=>s.lvl===L&&s.cost).map(s=>`a ${s.n}×${s.n} farm`)];
  if(L===MASTERY_LEVEL)un.push('crop mastery');
  showModal('Level '+L+'!',title(L),un.length?'New in the market: '+un.join(', ')+'.':'Keep it up, farmer!','','Back to the farm');
}

/* ---------- farmer & action queue ---------- */
let queue=[],cur=null,reserved=0,qcount={},proj={},mode='hand',placeId=null,moveSel=null,raf=0;
const WALK={plow:{dur:800,dust:1},plant:{dur:450},harvest:{dur:450},collect:{dur:500}};
function stateOf(k){
  if(proj[k])return proj[k];
  const t=S.tiles[k];if(!t)return'grass';
  if(t.t==='crop'){const st=stageOf(t,Date.now());return st==='w'?'withered':st==='r'?'ripe':'growing'}
  if(t.t==='item'){const it=I[t.item];return it.kind==='decor'?'decor':Date.now()>=readyAt(t)?'ready':'waiting'}
  return t.t;
}
function intent(k){
  const s=stateOf(k);
  return {grass:'plow',fallow:'plow',withered:'plow',plot:'plant',ripe:'harvest',ready:'collect'}[s]||'info';
}
const AFTER={plow:'plot',plant:'growing',harvest:'fallow',collect:'waiting'};
function enqueue(k,kind){
  let cost=0,crop=null;
  if(kind==='plow')cost=PLOW_COST;
  if(kind==='plant'){crop=S.sel;cost=C[crop].cost}
  if(S.coins-reserved<cost){floatAt(k,'Need coins','bad');hint(kind==='plow'?`Plowing costs ${PLOW_COST} coins. Harvest something first.`:`${C[crop].name} seeds cost ${cost} coins.`);return false}
  reserved+=cost;queue.push({k,kind,cost,crop});qcount[k]=(qcount[k]||0)+1;proj[k]=AFTER[kind];
  paint(k,Date.now());if(!raf)raf=requestAnimationFrame(step);return true;
}
let workUntil=0,last=0;
function step(t){
  raf=0;const dt=last?Math.min(50,t-last)/1000:0;last=t;
  if(!cur&&queue.length){cur=queue.shift();const [x,y]=cur.k.split(',').map(Number);cur.tx=x-.05;cur.ty=y+.62;cur.phase='walk'}
  if(cur){
    if(cur.phase==='walk'){
      const dx=cur.tx-S.farmer.x,dy=cur.ty-S.farmer.y,d=Math.hypot(dx,dy),mv=SPEED*dt;
      farmerEl.classList.add('walk');farmerEl.classList.remove('work');
      const sx=dx-dy;if(Math.abs(sx)>.02)farmerEl.classList.toggle('flip',sx<0);
      if(d<=mv||d<.01){S.farmer.x=cur.tx;S.farmer.y=cur.ty;cur.phase='work';workUntil=t+WALK[cur.kind].dur;farmerEl.classList.remove('walk','flip');farmerEl.classList.add('work');if(WALK[cur.kind].dust)dust(cur.k)}
      else{S.farmer.x+=dx/d*mv;S.farmer.y+=dy/d*mv}
      placeFarmer();
    }else if(t>=workUntil){finish(cur);cur=null;farmerEl.classList.remove('work')}
  }
  if(cur||queue.length)raf=requestAnimationFrame(step);else{last=0;save()}
}
function dust(k){const [x,y]=k.split(',').map(Number),p=screen(x,y);for(let i=0;i<3;i++){const d=document.createElement('div');d.className='dust';d.style.left=(p.x-7+(i-1)*W*.18)+'px';d.style.top=(p.y-4)+'px';d.style.zIndex=9000;d.style.animationDelay=i*90+'ms';board.append(d);setTimeout(()=>d.remove(),800)}}
function finish(job){
  const {k,kind}=job,tile=S.tiles[k],now=Date.now();
  reserved-=job.cost;qcount[k]--;if(!qcount[k]){delete qcount[k];delete proj[k]}
  const s=(()=>{const t=S.tiles[k];if(!t)return'grass';if(t.t==='crop'){const st=stageOf(t,now);return st==='w'?'withered':st==='r'?'ripe':'growing'}if(t.t==='item'){const it=I[t.item];return it.kind==='decor'?'decor':now>=readyAt(t)?'ready':'waiting'}return t.t})();
  if(kind==='plow'&&['grass','fallow','withered'].includes(s)){
    if(S.coins<PLOW_COST){floatAt(k,'Need coins','bad')}else{S.tiles[k]={t:'plot'};gain(k,-PLOW_COST,1);bump('plow')}}
  else if(kind==='plant'&&s==='plot'){const c=C[job.crop];
    if(S.coins<c.cost){floatAt(k,'Need coins','bad')}else{S.tiles[k]={t:'crop',crop:c.id,planted:now};gain(k,-c.cost,c.xp);bump('plant')}}
  else if(kind==='harvest'&&s==='ripe'){const c=C[tile.crop];
    let st=0;if(level()>=MASTERY_LEVEL){st=stars(c.id);S.mastery[c.id]=(S.mastery[c.id]||0)+1}
    const coins=Math.round(c.sell*(1+.1*st));S.tiles[k]={t:'fallow'};gain(k,coins,0);bump('harvest');
    const ns=stars(c.id);if(ns>st)toast(svg(fruit(c))+`<span>${c.name} mastery ${'★'.repeat(ns)}! +${10*ns}% coins</span>`)}
  else if(kind==='collect'&&s==='ready'){const it=I[tile.item];tile.last=now;gain(k,it.yield,0);bump(it.kind)}
  paint(k,now);
}
function stars(id){const n=S.mastery[id]||0;return MASTERY.filter(m=>n>=m).length}

function info(k){
  const tile=S.tiles[k],now=Date.now();if(!tile)return;
  if(qcount[k]){hint('Your farmer is on the way.');return}
  if(tile.t==='crop'){const c=C[tile.crop];hint(`${c.name} · ready in ${fmt(c.time-(now-tile.planted)/1000)}`)}
  else if(tile.t==='item'){const it=I[tile.item];hint(it.kind==='decor'?it.name+'.':`${it.name} · ready in ${fmt((readyAt(tile)-now)/1000)}`)}
}
function placeOn(k){
  if(S.tiles[k]||qcount[k]){hint('Pick an empty grass spot.');return false}
  if(mode==='gift'){
    S.tiles[k]={t:'item',item:placeId,last:Date.now()};S.gift[placeId]--;if(I[placeId].kind==='decor')bump('decor');
    if(!S.gift[placeId]){delete S.gift[placeId];setMode('hand');hint('Placed! Open the Gift Box for anything else.')}
    paint(k,Date.now());hud();save();return true}
  const it=I[placeId];
  if(S.coins<it.cost){floatAt(k,'Need coins','bad');hint(it.name+' costs '+it.cost+' coins.');return false}
  S.tiles[k]={t:'item',item:it.id,last:Date.now()};gain(k,-it.cost,it.xp);if(it.kind==='decor')bump('decor');
  paint(k,Date.now());save();return true;
}
function setMode(m,id){mode=m;placeId=id||null;if(moveSel){const o=moveSel;moveSel=null;keys[o]=null;paint(o,Date.now())}hud()}

/* ---------- input ---------- */
let drag=null;
function tileAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.classList&&el.classList.contains('tile')?el.dataset.k:null}
function tap(k,dragKind){
  if(mode==='hand'){const kind=intent(k);if(dragKind&&kind!==dragKind)return null;if(kind==='info'){if(!dragKind)info(k);return'info'}enqueue(k,kind);return kind}
  if(mode==='place'||mode==='gift'){if(dragKind&&dragKind!=='place')return null;return placeOn(k)?'place':null}
  if(mode==='delete'){const t=S.tiles[k];if(!t||qcount[k])return null;delete S.tiles[k];keys[k]=null;paint(k,Date.now());save();return'delete'}
  if(mode==='move'&&!dragKind){
    if(!moveSel){if(!S.tiles[k]||qcount[k]){hint('Tap something to move first.');return null}moveSel=k;keys[k]=null;paint(k,Date.now());hint('Now tap an empty grass spot.',['Cancel',()=>setMode('hand')]);return null}
    if(k===moveSel){setMode('move');hint('Tap something to move.',['Done',()=>setMode('hand')]);return null}
    if(S.tiles[k]||qcount[k]){hint('That spot is taken. Pick empty grass.');return null}
    S.tiles[k]=S.tiles[moveSel];delete S.tiles[moveSel];const o=moveSel;moveSel=null;keys[o]=null;keys[k]=null;paint(o,Date.now());paint(k,Date.now());save();
    hint('Moved! Tap something else to move.',['Done',()=>setMode('hand')]);return null}
  return null;
}
board.addEventListener('pointerdown',e=>{const k=tileAt(e);if(!k)return;e.preventDefault();const kind=tap(k,null);drag=kind&&kind!=='info'?{kind,done:new Set([k])}:null});
window.addEventListener('pointermove',e=>{if(!drag)return;const k=tileAt(e);if(!k||drag.done.has(k))return;drag.done.add(k);tap(k,drag.kind)});
window.addEventListener('pointerup',()=>drag=null);window.addEventListener('pointercancel',()=>drag=null);

/* ---------- sheets ---------- */
const wrap=document.getElementById('sheetwrap'),list=document.getElementById('sheetlist'),tabsEl=document.getElementById('sheettabs');
const coin=n=>`<span class="price"><span class="coin"></span>${n.toLocaleString()}</span>`;
function starHTML(id){const s=stars(id);return`<span class="stars">${'★'.repeat(s)}<span class="off">${'★'.repeat(3-s)}</span></span>`}
function sheet(title,note){document.getElementById('sheettitle').textContent=title;document.getElementById('sheetnote').textContent=note||'';tabsEl.hidden=true;wrap.hidden=false}
function close(){wrap.hidden=true}
let mtab='seeds';
function openMarket(tab){
  mtab=tab||mtab;const L=level();sheet('Market');tabsEl.hidden=false;
  tabsEl.innerHTML=[['seeds','Seeds'],['tree','Trees'],['animal','Animals'],['decor','Decorations']].map(([id,n])=>`<button data-t="${id}" aria-pressed="${id===mtab}">${n}</button>`).join('');
  tabsEl.onclick=e=>{const b=e.target.closest('button');if(b)openMarket(b.dataset.t)};
  if(mtab==='seeds'){
    document.getElementById('sheetnote').textContent=`Plant on plowed plots. Planting gives XP and harvesting gives coins.${L<MASTERY_LEVEL?` Crop mastery opens at level ${MASTERY_LEVEL}.`:''}`;
    list.innerHTML=CROPS.map(c=>{const lock=L<c.lvl;return`<button class="item${c.id===S.sel?' on':''}${lock?' locked':''}" data-id="${c.id}">
      <span class="pic s">${plantSVG(c,'r')}</span>
      <span><b>${c.name}</b><span class="meta">${lock?'Unlocks at level '+c.lvl:`Grows ${fmt(c.time)} · sells ${c.sell} · +${c.xp} XP`}${!lock&&L>=MASTERY_LEVEL?'<br>'+starHTML(c.id)+' '+(S.mastery[c.id]||0)+' harvested':''}</span></span>${coin(c.cost)}</button>`}).join('');
    list.onclick=e=>{const b=e.target.closest('.item');if(!b)return;const c=C[b.dataset.id];if(L<c.lvl){hint(c.name+' unlocks at level '+c.lvl+'.');return}
      S.sel=c.id;save();setMode('hand');close();hint(c.name+' selected. Tap plowed plots to plant.')};
  }else{
    document.getElementById('sheetnote').textContent=mtab==='decor'?'Decorations make your farm yours. Placing gives XP.':mtab==='tree'?'Trees never wither. Collect fruit whenever it is ripe.':'Animals never get sick or wander off. Collect when you see the bubble.';
    list.innerHTML=ITEMS.filter(i=>i.kind===mtab).map(it=>{const lock=L<it.lvl;return`<button class="item${lock?' locked':''}" data-id="${it.id}">
      <span class="pic">${itemSVG(it.id,it.kind!=='decor')}</span>
      <span><b>${it.name}</b><span class="meta">${lock?'Unlocks at level '+it.lvl:it.kind==='decor'?`+${it.xp} XP`:`Every ${fmt(it.time)} · ${it.yield} coins · +${it.xp} XP`}</span></span>${coin(it.cost)}</button>`}).join('');
    list.onclick=e=>{const b=e.target.closest('.item');if(!b)return;const it=I[b.dataset.id];if(L<it.lvl){hint(it.name+' unlocks at level '+it.lvl+'.');return}
      if(S.coins<it.cost){hint(it.name+' costs '+it.cost+' coins.');return}
      close();setMode('place',it.id);hint('Tap grass to place your '+it.name+'.',['Done',()=>setMode('hand')])};
  }
}
function openGift(){
  sheet('Gift Box','Gifts wait here until you place them.');
  const ids=Object.keys(S.gift);
  list.innerHTML=ids.length?ids.map(id=>{const it=I[id];return`<button class="item" data-id="${id}"><span class="pic">${itemSVG(id,it.kind!=='decor')}</span><span><b>${it.name}</b><span class="meta">${it.kind==='tree'?'Tree':it.kind==='animal'?'Animal':'Decoration'}</span></span><span class="price">×${S.gift[id]}</span></button>`}).join('')
    :'<p class="meta" style="padding:8px 4px">Your gift box is empty.</p>';
  list.onclick=e=>{const b=e.target.closest('.item');if(!b)return;close();setMode('gift',b.dataset.id);hint('Tap grass to place your '+I[b.dataset.id].name+'.',['Done',()=>setMode('hand')])};
}
function openRibbons(){
  sheet('Ribbons','Every ribbon has four colors: yellow, white, red and blue.');
  list.innerHTML=RIBBONS.map(r=>{const have=S.ribbons[r.id]||0,n=S.stats[r.stat]||0,next=r.tiers[have];
    const col=have?TIER[have-1].c:'#e3d6bd';
    return`<div class="item" style="grid-template-columns:44px 1fr auto"><span class="rib">${ribbonSVG(col,!have)}</span><span><b>${r.name}</b><span class="meta">${r.desc}${next?` · ${n.toLocaleString()} / ${next.toLocaleString()} for ${TIER[have].n}`:' · all colors earned'}</span><span class="prog"><i style="width:${next?Math.min(100,100*n/next):100}%"></i></span></span><span class="meta">${have}/4</span></div>`}).join('');
  list.onclick=null;
}
function openMore(){
  sheet('Tools');const idx=SIZES.findIndex(s=>s.n===S.size),next=SIZES[idx+1];
  list.innerHTML=`<button class="item" data-a="move" style="grid-template-columns:52px 1fr"><span class="pic">${ICON.move}</span><span><b>Move</b><span class="meta">Pick something up and put it somewhere else.</span></span></button>
  <button class="item" data-a="delete" style="grid-template-columns:52px 1fr"><span class="pic">${ICON.del}</span><span><b>Delete</b><span class="meta">Clear anything back to grass. No refunds.</span></span></button>
  <button class="item" data-a="expand"><span class="pic">${ICON.expand}</span><span><b>Expand farm</b><span class="meta">${next?`${next.n}×${next.n} · needs level ${next.lvl}`:'Your farm is at its biggest size.'}</span></span>${next?coin(next.cost):''}</button>`;
  list.onclick=e=>{const b=e.target.closest('.item');if(!b)return;const a=b.dataset.a;
    if(a==='move'){close();setMode('move');hint('Tap something to move.',['Done',()=>setMode('hand')])}
    if(a==='delete'){close();setMode('delete');hint('Tap anything to clear it.',['Done',()=>setMode('hand')])}
    if(a==='expand'&&next){if(level()<next.lvl){hint(`Expanding to ${next.n}×${next.n} needs level ${next.lvl}.`);return}if(S.coins<next.cost){hint(`You need ${(next.cost-S.coins).toLocaleString()} more coins.`);return}
      S.coins-=next.cost;S.size=next.n;save();close();layout();hud();hint('Welcome to your '+next.n+'×'+next.n+' farm!')}};
}
function openFarmer(){
  const li=levelInfo(S.xp),L=li.L;sheet('Level '+L+' · '+title(L),`${(li.need-li.into).toLocaleString()} XP to level ${L+1} (${title(L+1)}). Plowing, planting and buying give XP.`);
  const ups=[];for(let l=L+1;l<=L+4;l++){const u=[...CROPS.filter(c=>c.lvl===l).map(c=>c.name),...ITEMS.filter(i=>i.lvl===l).map(i=>i.name)];if(l===MASTERY_LEVEL)u.push('Crop mastery');if(u.length)ups.push(`<div class="item" style="grid-template-columns:52px 1fr"><span class="lvl" style="width:40px;height:40px;font-size:1.1rem;margin:auto">${l}</span><span><b>${title(l)}</b><span class="meta">${u.join(', ')}</span></span></div>`)}
  list.innerHTML=ups.join('')||'<p class="meta">More is coming soon.</p>';list.onclick=null;
}
document.getElementById('sheetclose').onclick=close;
wrap.addEventListener('click',e=>{if(e.target===wrap)close()});
document.getElementById('t-hand').onclick=()=>{setMode('hand');hint('Farm tool: tap to plow, plant, harvest and collect. Drag to queue a row.')};
document.getElementById('t-market').onclick=()=>openMarket();
document.getElementById('t-gift').onclick=openGift;
document.getElementById('t-ribbons').onclick=openRibbons;
document.getElementById('t-more').onclick=openMore;
document.getElementById('lvlchip').onclick=openFarmer;

/* ---------- start ---------- */
layout();hud();
if(!S.welcomed){
  S.welcomed=true;for(const id in WELCOME)S.gift[id]=(S.gift[id]||0)+WELCOME[id];save();hud();
  showModal('Welcome to Clover Hollow!','A welcome package arrived','A fruit tree, a cow, a hen and hay bales to get your farm started. They are waiting in your Gift Box.',
    Object.entries(WELCOME).map(([id,n])=>`<span>${itemSVG(id,false)}${n>1?`<em>×${n}</em>`:''}</span>`).join(''),'Open my Gift Box',openGift);
  hint('Your six plots are plowed. Pick Sunpea seeds in the Market and tap a plot to plant.');
}else hint('Welcome back, '+title(level())+'! Tap to plow, plant, harvest and collect.');
setInterval(()=>{paintAll()},1000);
setInterval(save,10000);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layout,120)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else paintAll()});
})();
</script>
